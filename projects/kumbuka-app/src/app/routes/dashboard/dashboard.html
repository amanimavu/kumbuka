<!-- Summary section -->
<section class="grid grid-cols-2 gap-10">
	<div class="grid grid-cols-2 gap-5">
		<summary-card
			variant="lentCount"
			title="Active loans Lent"
			[count]="dashboardAnalytics().activeLoansLent"
		>
			<svg class="w-6" money-bag-icon></svg>
		</summary-card>
		<summary-card
			variant="borrowedCount"
			title="Active loans borrowed"
			[count]="dashboardAnalytics().activeLoansBorrowed"
		>
			<svg class="w-6" money-bag-icon></svg>
		</summary-card>
	</div>
	<summary-card
		variant="overdueCount"
		title="Overdue loans"
		[count]="dashboardAnalytics().overdueLoans"
	>
		<svg class="w-6" money-bag-icon></svg>
	</summary-card>
</section>

<div class="grid grid-cols-2 gap-10">
	<p-card class="mt-12">
		<h3 class="text-center font-semibold text-lg text-neutral-600 mb-4">
			Total Money Movement
		</h3>
		<p-chart
			type="doughnut"
			[data]="lentVsBorrowedData"
			[options]="options"
			class="w-full md:w-120"
		/>
	</p-card>
	<p-card class="mt-12">
		<h3 class="text-center font-semibold text-lg text-neutral-600 mb-4">
			Outstanding Balances
		</h3>
		<p-chart
			type="doughnut"
			[data]="balancesData"
			[options]="options"
			class="w-full md:w-120"
		/>
	</p-card>
</div>
