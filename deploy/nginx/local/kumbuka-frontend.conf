# Kumbuka local dev - frontend reverse proxy
# Each *.kumbuka.local host -> its ng serve dev server on 127.0.0.1.
# Angular dev server allowedHosts ".kumbuka.local" (angular.json),
# so nginx terminates the friendly hostname and forwards to the port.
# WebSocket upgrade headers required for Angular CLI HMR.
#
# /etc/hosts:
#   127.0.0.1 app.kumbuka.local portal.kumbuka.local website.kumbuka.local

server {
    listen 80;
    server_name app.kumbuka.local;
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name portal.kumbuka.local;
    location / {
        proxy_pass http://127.0.0.1:4201;
