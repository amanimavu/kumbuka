<div class="w-1/4 mx-auto">
	<div class="flex flex-col items-center text-center mb-8 gap-1">
		<svg class="w-16" kumbuka-logo></svg>
		<h4 class="font-semibold text-2xl">Welcome Back</h4>
		<p class="text-neutral-400">
			Access your dashboard and manage your lending circles with clarity and ease
		</p>
	</div>
	<p-card class="text-sm">
		<p-tabs value="password">
			<p-tablist>
				<p-tab class="grow" value="password">Password</p-tab>
				<p-tab class="grow" value="password-less">Password less</p-tab>
			</p-tablist>
			<p-tabpanels>
				<p-tabpanel value="password">
					<form>
						<div class="flex flex-col gap-1 my-3">
							<label for="email">Email</label>
							<input
								id="email"
								type="text"
								pInputText
								variant="filled"
								placeholder="johndoe@gmail.com"
							/>
						</div>
						<div class="flex flex-col gap-1 my-3">
							<div class="flex justify-between">
								<label for="password">Password</label>
								<a
									class="hover:underline hover:underline-offset-2"
									routerLink="/auth/forgot-password"
									>forgot password?</a
								>
							</div>
							<p-password
								[feedback]="false"
								class="[&>input]:grow"
								id="password"
								[toggleMask]="true"
								autocomplete="off"
								variant="filled"
								placeholder="password"
							/>
						</div>
						<button pButton class="w-full mt-4">
							<span pButtonLabel>Login</span>
							<svg class="w-7 text-white" arrow-right-icon></svg>
						</button>
					</form>
				</p-tabpanel>
				<p-tabpanel value="password-less">
					<form>
						<div class="flex flex-col gap-1 my-3">
							<label for="email">Email</label>
							<input
								id="email"
								type="text"
								pInputText
								variant="filled"
								placeholder="johndoe@gmail.com"
							/>
						</div>
						<div class="flex flex-col gap-1 my-3">
							<label for="otp">OTP</label>
							<p-inputotp id="otp" [length]="6" class="justify-between" />
						</div>
						<button pButton class="w-full mt-4">
							<span pButtonLabel>Login</span>
							<svg class="w-7 text-white" arrow-right-icon></svg>
						</button>
					</form>
				</p-tabpanel>
			</p-tabpanels>
		</p-tabs>
	</p-card>
	<p-divider class="[&>div]:bg-[#F8F9FF]!" align="center">
		<b>OR</b>
	</p-divider>
	<p class="text-center tracking-wider text-sm">
		Don't have an account?
		<a routerLink="/auth/sign-up" class="text-[#B52614] hover:underline underline-offset-2"
			>Sign Up</a
		>
	</p>
</div>
