<div class="w-1/4 mx-auto flex flex-col h-[calc(100vh-7rem)] justify-center">
	<div class="flex flex-col items-center text-center mb-8 gap-1">
		<svg class="w-16" kumbuka-logo></svg>
		<h4 class="font-semibold text-2xl mt-4">Reset Password?</h4>
		<p>Choose a new password for your Kumbuka account</p>
	</div>
	<p-card>
		<form>
			<div class="flex flex-col gap-2 mb-6">
				<label for="password">New Password</label>
				<p-password
					class="[&>input]:grow"
					id="password"
					[toggleMask]="true"
					autocomplete="off"
					variant="filled"
					placeholder="password"
				/>
			</div>
			<div class="flex flex-col gap-2 mb-6">
				<label for="confirm-password">Confirm Password</label>
				<p-password
					class="[&>input]:grow"
					id="confirm-password"
					[toggleMask]="true"
					autocomplete="off"
					feedback="false"
					variant="filled"
					placeholder="password"
				/>
			</div>
			<button pButton class="w-full">
				<span pButtonLabel>Reset Password</span>
				<svg pButtonIcon class="w-7" arrow-right-icon></svg>
			</button>
		</form>
	</p-card>
	<a id="back-to-login-link" class="flex justify-center mt-14" routerLink="/auth/login">
		<svg class="w-7 inline-block mr-2" arrow-left-icon></svg>
		<span>Back to Login</span>
	</a>
</div>
