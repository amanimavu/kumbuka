<app-transaction-details-drawer
	[visible]="visible()"
	[record]="selectedRecord()"
	(hide)="handleDrawerHide($event)"
/>
<div class="flex justify-between">
	<segmented
		defaultValue="money lent"
		[onChange]="handleSegmentChange"
		[options]="segmentOptions"
	>
		<ng-template let-option>
			<span>{{ option }}</span>
		</ng-template>
	</segmented>
	<div class="flex gap-2 w-[45%] lg:w-[35%]">
		<p-iconfield class="grow">
			<p-inputicon class="-translate-y-1.5">
				<svg class="w-6 content-center" search-icon></svg>
			</p-inputicon>
			<input
				placeholder="Search"
				type="text"
				pInputText
				class="grow w-full"
				(input)="handleInput($event)"
			/>
		</p-iconfield>
		<p-button (click)="openCreateModal()">
			<svg class="w-5" add-icon></svg>
			<span class="ml-1 hidden md:inline">Record</span>
		</p-button>
	</div>
</div>

@if (segment() === 'money_lent') {
	<app-disbursements-list
		[disbursements]="disbursements()"
		[isLoading]="isLoadingDisbursements()"
		[selectedRecord]="selectedRecord()"
		[tableHeight]="tableHeight()"
		(rowSelect)="handleRowSelect($event)"
		(recordPayment)="openPaymentModal($event)"
		(edit)="openEditModal($event)"
	/>
} @else {
	<app-obligations-list
		[obligations]="obligations()"
		[isLoading]="isLoadingObligations()"
		(logRepayment)="openBorrowedPaymentModal($event)"
		(edit)="openBorrowedEditModal($event)"
	/>
}

<!-- Edit Modal -->
<p-dialog
	header="Edit Loan"
	[modal]="true"
	dismissableMask="true"
	[visible]="isEditModalVisible()"
	(visibleChange)="isEditModalVisible.set($event)"
	[style]="{ width: '30vw' }"
>
	<form [formGroup]="editForm" (ngSubmit)="saveEdit()" class="flex flex-col gap-4 mt-2">
		<div class="flex flex-col gap-1">
			<label for="personName" class="font-semibold text-sm">Borrower Name</label>
			<input id="personName" type="text" pInputText formControlName="personName" />
		</div>
		<div class="flex flex-col gap-1">
			<label for="phoneNumber" class="font-semibold text-sm">Phone Number</label>
			<input id="phoneNumber" type="text" pInputText formControlName="phoneNumber" />
		</div>
		<div class="flex flex-col gap-1">
			<label for="amountLent" class="font-semibold text-sm">Amount Lent (KSH)</label>
			<input id="amountLent" type="number" pInputText formControlName="amountLent" />
		</div>
		<div class="flex gap-4">
			<div class="flex flex-col gap-1 grow">
				<label for="dateLent" class="font-semibold text-sm">Date Lent</label>
				<input id="dateLent" type="date" pInputText formControlName="dateLent" />
			</div>
			<div class="flex flex-col gap-1 grow">
				<label for="dueDate" class="font-semibold text-sm">Due Date</label>
				<input id="dueDate" type="date" pInputText formControlName="dueDate" />
			</div>
		</div>
		<div class="flex flex-col gap-1">
			<label for="notes" class="font-semibold text-sm">Notes</label>
			<input id="notes" type="text" pInputText formControlName="notes" />
		</div>
		<div class="flex justify-end gap-2 mt-4">
			<p-button label="Cancel" severity="secondary" (click)="isEditModalVisible.set(false)" />
			<p-button
				label="Save"
				type="submit"
				[disabled]="editForm.invalid"
				[loading]="isSaving()"
			/>
		</div>
	</form>
</p-dialog>

<!-- Create Lent Modal -->
<p-dialog
	header="Record Money Lent"
	[modal]="true"
	dismissableMask="true"
	[visible]="isCreateLentModalVisible()"
	(visibleChange)="isCreateLentModalVisible.set($event)"
	[style]="{ width: '30vw' }"
>
	<form
		[formGroup]="createLentForm"
		(ngSubmit)="saveNewLentLoan()"
		class="flex flex-col gap-4 mt-2"
	>
		<div class="flex flex-col gap-1">
			<label for="createPersonName" class="font-semibold text-sm">Borrower Name</label>
			<input id="createPersonName" type="text" pInputText formControlName="personName" />
		</div>
		<div class="flex flex-col gap-1">
			<label for="createPhoneNumber" class="font-semibold text-sm">Phone Number</label>
			<input id="createPhoneNumber" type="text" pInputText formControlName="phoneNumber" />
		</div>
		<div class="flex flex-col gap-1">
			<label for="createAmountLent" class="font-semibold text-sm">Amount Lent (KSH)</label>
			<input id="createAmountLent" type="number" pInputText formControlName="amountLent" />
		</div>
		<div class="flex gap-4">
			<div class="flex flex-col gap-1 grow">
				<label for="createDateLent" class="font-semibold text-sm">Date Lent</label>
				<input id="createDateLent" type="date" pInputText formControlName="dateLent" />
			</div>
			<div class="flex flex-col gap-1 grow">
				<label for="createDueDate" class="font-semibold text-sm">Due Date</label>
				<input id="createDueDate" type="date" pInputText formControlName="dueDate" />
			</div>
		</div>
		<div class="flex flex-col gap-1">
			<label for="createNotes" class="font-semibold text-sm">Notes</label>
			<input id="createNotes" type="text" pInputText formControlName="notes" />
		</div>
		<div class="flex justify-end gap-2 mt-4">
			<p-button
				label="Cancel"
				severity="secondary"
				(click)="isCreateLentModalVisible.set(false)"
			/>
			<p-button
				label="Save"
				type="submit"
				[disabled]="createLentForm.invalid"
				[loading]="isSavingNewLent()"
			/>
		</div>
	</form>
</p-dialog>

		<div class="flex flex-col gap-1">

			<input
				id="createBorrowedPhoneNumber"

				<input

			/>

<!-- Borrowed Payment Modal -->
<p-dialog
	header="Log Repayment"
	[modal]="true"
	dismissableMask="true"
	[visible]="isBorrowedPaymentModalVisible()"
	(visibleChange)="isBorrowedPaymentModalVisible.set($event)"
	[style]="{ width: '25vw' }"
>
	<form
		[formGroup]="borrowedPaymentForm"
		(ngSubmit)="saveBorrowedPayment()"
		class="flex flex-col gap-4 mt-2"
	>
		<div class="flex flex-col gap-1">
			<label for="borrowedPaymentAmount" class="font-semibold text-sm"
				>Amount Paid (KSH)</label
			>
			<input id="borrowedPaymentAmount" type="number" pInputText formControlName="amount" />
			@if (borrowedPaymentForm.get('amount')?.hasError('max')) {
				<small class="text-red-500 text-xs mt-1"
					>Amount cannot exceed the remaining balance.</small
				>
			}
		</div>
		<div class="flex justify-end gap-2 mt-4">
			<p-button
				label="Cancel"
				severity="secondary"
				(click)="isBorrowedPaymentModalVisible.set(false)"
			/>
			<p-button
				label="Save Payment"
				type="submit"
				[disabled]="borrowedPaymentForm.invalid"
				[loading]="isSavingBorrowedPayment()"
			/>
		</div>
	</form>
</p-dialog>

<!-- Payment Modal -->
<p-dialog
	header="Record Payment"
	[modal]="true"
	dismissableMask="true"
	[visible]="isPaymentModalVisible()"
	(visibleChange)="isPaymentModalVisible.set($event)"
	[style]="{ width: '25vw' }"
>
	<form [formGroup]="paymentForm" (ngSubmit)="savePayment()" class="flex flex-col gap-4 mt-2">
		<div class="flex flex-col gap-1">
			<label for="paymentAmount" class="font-semibold text-sm">Amount Paid (KSH)</label>
			<input id="paymentAmount" type="number" pInputText formControlName="amount" />
			@if (paymentForm.get('amount')?.hasError('max')) {
				<small class="text-red-500 text-xs mt-1"
					>Amount cannot exceed the remaining balance.</small
				>
			}
		</div>
		<div class="flex justify-end gap-2 mt-4">
			<p-button
				label="Cancel"
				severity="secondary"
				(click)="isPaymentModalVisible.set(false)"
			/>
			<p-button
				label="Save Payment"
				type="submit"
				[disabled]="paymentForm.invalid"
				[loading]="isSavingPayment()"
			/>
		</div>
	</form>
</p-dialog>
