<div class="w-1/4 mx-auto flex flex-col h-[calc(100vh-7rem)] justify-center">
	<div class="flex flex-col items-center text-center mb-8 gap-1">
		<svg class="w-16" kumbuka-logo></svg>
		<h4 class="font-semibold text-2xl mt-4">Forgot Password?</h4>
		<p>Enter your email address and we'll send you a link to reset your password</p>
	</div>
	<p-card>
		<form>
			<div class="flex flex-col gap-2 mb-6">
				<label for="email">Email</label>
				<input pInputText id="email" variant="filled" placeholder="johndoe@gmail.com" />
			</div>
			<button pButton class="w-full">
				<span pButtonLabel>Send Reset Link</span>
				<svg pButtonIcon class="w-7" send-icon></svg>
			</button>
		</form>
	</p-card>
	<a id="back-to-login-link" class="flex justify-center mt-14" routerLink="/auth/login">
		<svg class="w-7 inline-block mr-2" arrow-left-icon></svg>
		<span>Back to Login</span>
	</a>
</div>
