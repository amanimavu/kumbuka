<div class="relative h-screen overflow-hidden bg-[#F8F9FF]">
	<div
		class="h-[35vh] w-[20vw] rounded-[23vh] bg-[#E5EEFF60] absolute -top-20 -right-15 blur-3xl"
	></div>
	<p-card class="w-1/3 mx-auto mt-16 px-4!">
		<p-image
			src="folder-search.png"
			alt="Not found image"
			width="280"
			class="[&>img]:mx-auto!"
		/>
		<div class="flex flex-col items-center gap-3">
			<h3 class="w-2/3 font-bold text-2xl text-center">
				Even the most balanced ledgers have their gaps
			</h3>
			<p class="w-3/4 text-center">
				The page you are looking for might have been moved or doesn't exist in our records.
			</p>
		</div>
		<div class="flex justify-center gap-6 mt-5 mb-8 items-center">
			<p-button label="Back to base" (click)="handleRedirect()" />
			<div class="flex gap-1">
				<svg class="w-4" help-icon></svg>
				<a class="hover:underline" href="#">Contact support </a>
			</div>
		</div>
		<p-divider />
		<p class="uppercase text-sm text-neutral-500 text-center tracking-wide">
			Kumbuka: Lending made light
		</p>
	</p-card>
	<div
		class="h-[35vh] w-[20vw] rounded-[23vh] bg-[#E5EEFF] opacity-85 absolute -bottom-10 -left-10 blur-3xl"
	></div>
</div>
